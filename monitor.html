<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>主控监控</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f2f5f3;color:#1c2b22;min-height:100vh}
  .wrap{display:grid;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 10px 20px;grid-template-columns:1fr;max-width:560px;margin:0 auto}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden}
  .hd{display:flex;align-items:center;gap:10px;padding:13px 16px;background:linear-gradient(90deg,#07a35a,#0bbf6b);color:#fff}
  .dot{width:11px;height:11px;border-radius:50%;background:#fff;flex:0 0 auto;animation:pulse 1.1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  .hd .t{font-size:15px;font-weight:700;flex:1 1 auto}
  .hd .u{font-size:12px;opacity:.92;flex:0 0 auto}
  .sec-t{padding:13px 16px 6px;font-size:13px;font-weight:800;color:#07a35a}
  .a{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-top:1px solid #eef1ef}
  .a .s{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto}
  .a .s.run{background:#0bbf6b}.a .s.wait{background:#b9c4bd}
  .a .n{font-size:14px;font-weight:700}
  .a .d{font-size:12px;color:#5a6b60;margin-top:1px}
  ol.q{padding:4px 16px 14px 32px}
  ol.q li{font-size:13px;margin:8px 0}
  .note{font-size:11px;color:#8a978f;padding:2px 16px 13px}

  /* 平板 / 电脑端：宽屏居中、两栏并排 */
  @media (min-width:768px){
    .wrap{max-width:1040px;grid-template-columns:3fr 2fr;grid-auto-rows:min-content;align-items:start}
    .card.top{grid-column:1 / -1}
    .hd{padding:16px 22px}.hd .t{font-size:17px}
    .sec-t{font-size:14px;padding:16px 22px 8px}
    .a{padding:12px 22px}.a .n{font-size:15px}.a .d{font-size:13px}
    ol.q{padding:6px 22px 18px 38px}ol.q li{font-size:14px;margin:10px 0}
    .note{padding:4px 22px 16px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card top">
      <div class="hd"><span class="dot"></span><span class="t" id="main">连接中…</span><span class="u" id="upd"></span></div>
    </div>
    <div class="card">
      <div class="sec-t">助理在干嘛</div>
      <div id="assistants"></div>
      <div class="note" id="cap"></div>
    </div>
    <div class="card">
      <div class="sec-t">排队任务</div>
      <ol class="q" id="queue"></ol>
    </div>
  </div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function load(){
  fetch("monitor.json?t="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(d){
      document.getElementById("main").textContent=d.main;
      document.getElementById("upd").textContent=d.updatedAt;
      document.getElementById("cap").textContent=d.capNote||"";
      var ah="";
      d.assistants.forEach(function(a){
        var cls=(a.status==="运行"||a.status==="运行中")?"run":"wait";
        ah+="<div class='a'><span class='s "+cls+"'></span><div><div class='n'>"+esc(a.name)+" · "+esc(a.status)+"</div><div class='d'>"+esc(a.doing)+"</div></div></div>";
      });
      document.getElementById("assistants").innerHTML=ah;
      var qh="";
      d.queue.forEach(function(x){qh+="<li>"+esc(x)+"</li>";});
      document.getElementById("queue").innerHTML=qh;
    }).catch(function(){document.getElementById("main").textContent="等待数据（后台运行中）";});
}
load();setInterval(load,20000);
</script>
</body>
</html>
